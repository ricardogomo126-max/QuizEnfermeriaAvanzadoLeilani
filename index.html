<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Operación Repaso</title>
  <style>
    /* === ESTILOS GENERALES === */
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #ffb6c1, #ff69b4);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .app-container {
      background: #fff;
      border-radius: 20px;
      padding: 30px;
      width: 90%;
      max-width: 600px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    @media (min-width: 768px) {
      .app-container {
        width: 50%;
      }
    }

    h1, h2 {
      color: #d63384;
    }

    p {
      color: #444;
    }

    .love {
      font-weight: bold;
      color: #c2185b;
      font-size: 1.2em;
    }

    /* === BOTONES === */
    button {
      background: #d63384;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      margin: 10px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover {
      background: #ad1457;
    }

    .subject-buttons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
    }

    #options button {
      display: block;
      width: 100%;
      margin: 8px 0;
      padding: 12px;
      font-size: 1rem;
      border-radius: 10px;
      border: 2px solid #ff69b4;
      background: white;
      color: #d63384;
    }

    #options button:hover {
      background: #ff69b4;
      color: white;
    }

    /* === BARRA DE PROGRESO === */
    .progress-bar-container {
      background-color: #ffd6e0;
      width: 100%;
      height: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background-color: #d63384;
      border-radius: 10px;
      transition: width 0.3s;
    }

    /* === PANTALLAS === */
    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    /* === FEEDBACK === */
    #feedback-message {
      font-size: 1.5rem;
      color: #ad1457;
    }

    #feedback-detail {
      color: #555;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="app-container" id="app">
    <!-- Pantalla de inicio -->
    <div id="start-screen" class="screen active">
      <h1>Operación Repaso</h1>
      <h2>Quiz avanzado de Enfermería</h2>
      <p>Mucha suerte Leilani 💕</p>
      <p class="love">Te amo</p>
      <div class="subject-buttons">
        <button onclick="startQuiz('Farmacología')">Farmacología</button>
        <button onclick="startQuiz('Anatomía')">Anatomía</button>
      </div>
    </div>

    <!-- Pantalla de preguntas -->
    <div id="quiz-screen" class="screen">
      <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      <h2 id="question-text"></h2>
      <div id="options"></div>
    </div>

    <!-- Pantalla de feedback -->
    <div id="feedback-screen" class="screen">
      <h2 id="feedback-message"></h2>
      <p id="feedback-detail"></p>
      <button onclick="nextQuestion()">Siguiente</button>
    </div>

    <!-- Pantalla de resultados -->
    <div id="result-screen" class="screen">
      <h2 id="result-text"></h2>
      <p id="result-message"></p>
      <button onclick="goHome()">Reiniciar</button>
    </div>
  </div>

  <script>
    /* === JAVASCRIPT === */

    const allQuestions = {
      Farmacología: [
      { text: "¿Qué es la farmacología?", options: ["Ciencia que estudia los medicamentos y sus efectos", "Ciencia que estudia los huesos", "Ciencia que estudia los genes", "Ciencia que estudia los alimentos"], answerIndex: 0, feedback: "La farmacología analiza los efectos de los fármacos en los organismos vivos." },
  { text: "¿Qué es un fármaco?", options: ["Cualquier sustancia química que produce un efecto biológico", "Una vitamina", "Un mineral", "Un alimento"], answerIndex: 0, feedback: "Un fármaco es toda sustancia capaz de modificar funciones fisiológicas." },
  { text: "¿Cuál es el objetivo principal de la farmacocinética?", options: ["Estudiar cómo el cuerpo afecta al fármaco", "Estudiar cómo el fármaco afecta al cuerpo", "Analizar efectos adversos", "Evaluar reacciones alérgicas"], answerIndex: 0, feedback: "La farmacocinética analiza absorción, distribución, metabolismo y excreción del fármaco." },
  { text: "¿Cuál es la vía más rápida de administración de medicamentos?", options: ["Intravenosa", "Oral", "Subcutánea", "Rectal"], answerIndex: 0, feedback: "La vía intravenosa permite que el fármaco llegue directamente al torrente sanguíneo." },
  { text: "¿Qué es la biodisponibilidad?", options: ["Porcentaje del fármaco que llega a la circulación sistémica", "Cantidad de fármaco eliminado por el hígado", "Capacidad de unión a proteínas", "Volumen de distribución"], answerIndex: 0, feedback: "La biodisponibilidad indica cuánto del fármaco administrado llega a la sangre sin alterarse." },
  { text: "¿Qué órgano es el principal responsable del metabolismo de los fármacos?", options: ["Hígado", "Riñón", "Pulmón", "Estómago"], answerIndex: 0, feedback: "El hígado metaboliza la mayoría de los fármacos mediante enzimas del citocromo P450." },
  { text: "¿Qué significa la sigla ADME?", options: ["Absorción, Distribución, Metabolismo y Excreción", "Acción, Dosis, Metabolismo y Eliminación", "Administración, Digestión, Movimiento y Excreción", "Absorción, Digestión, Medición y Evaluación"], answerIndex: 0, feedback: "ADME describe las fases farmacocinéticas del recorrido del fármaco en el organismo." },
  { text: "¿Qué es un efecto adverso?", options: ["Reacción no deseada producida por un medicamento", "Efecto terapéutico esperado", "Interacción entre alimentos", "Efecto placebo"], answerIndex: 0, feedback: "Los efectos adversos son reacciones perjudiciales no intencionadas de un medicamento." },
  { text: "¿Cuál es la principal función de los antiinflamatorios no esteroideos (AINEs)?", options: ["Reducir dolor, fiebre e inflamación", "Reducir ansiedad", "Aumentar la presión arterial", "Estimular el apetito"], answerIndex: 0, feedback: "Los AINEs inhiben la síntesis de prostaglandinas, reduciendo dolor e inflamación." },
  { text: "¿Cuál es el mecanismo de acción del paracetamol?", options: ["Inhibe la síntesis de prostaglandinas en el SNC", "Bloquea receptores beta", "Estimula receptores alfa", "Inhibe la recaptación de serotonina"], answerIndex: 0, feedback: "El paracetamol actúa en el sistema nervioso central reduciendo fiebre y dolor." },
  { text: "¿Qué tipo de medicamento es la penicilina?", options: ["Antibiótico", "Antihipertensivo", "Antidepresivo", "Analgésico"], answerIndex: 0, feedback: "La penicilina es un antibiótico betalactámico que inhibe la síntesis de la pared bacteriana." },
  { text: "¿Cuál es la principal vía de eliminación de los fármacos?", options: ["Renal", "Pulmonar", "Cutánea", "Digestiva"], answerIndex: 0, feedback: "El riñón excreta la mayoría de los metabolitos de los fármacos a través de la orina." },
  { text: "¿Qué son los agonistas?", options: ["Fármacos que activan receptores", "Fármacos que bloquean receptores", "Sustancias que destruyen enzimas", "Vitaminas"], answerIndex: 0, feedback: "Los agonistas se unen a los receptores y los activan para producir una respuesta." },
  { text: "¿Qué son los antagonistas?", options: ["Fármacos que bloquean receptores", "Fármacos que estimulan receptores", "Fármacos que destruyen bacterias", "Sustancias endógenas"], answerIndex: 0, feedback: "Los antagonistas impiden la acción de un agonista al bloquear el receptor." },
  { text: "¿Qué es la vida media de un fármaco?", options: ["Tiempo para reducir a la mitad su concentración plasmática", "Tiempo que tarda en hacer efecto", "Duración del tratamiento", "Tiempo que permanece en el estómago"], answerIndex: 0, feedback: "La vida media indica cuánto tarda el cuerpo en eliminar la mitad del fármaco." },
  { text: "¿Qué significa el término 'efecto placebo'?", options: ["Mejora por expectativa sin acción farmacológica", "Efecto adverso severo", "Respuesta alérgica", "Aceleración metabólica"], answerIndex: 0, feedback: "El efecto placebo es una respuesta psicológica positiva sin base farmacológica real." },
  { text: "¿Qué grupo farmacológico actúa reduciendo la presión arterial?", options: ["Antihipertensivos", "Analgésicos", "Antibióticos", "Antihistamínicos"], answerIndex: 0, feedback: "Los antihipertensivos controlan la presión arterial reduciendo la carga cardiovascular." },
  { text: "¿Qué tipo de fármaco es el diazepam?", options: ["Ansiolítico benzodiacepínico", "Antibiótico", "Diurético", "Analgésico"], answerIndex: 0, feedback: "El diazepam es una benzodiacepina usada para ansiedad, insomnio y convulsiones." },
  { text: "¿Cuál es el principal efecto adverso de los opioides?", options: ["Depresión respiratoria", "Hipertensión", "Diarrea", "Taquicardia"], answerIndex: 0, feedback: "Los opioides pueden suprimir el centro respiratorio en dosis altas." },
  { text: "¿Cuál es el antídoto del paracetamol en sobredosis?", options: ["N-acetilcisteína", "Vitamina C", "Atropina", "Naloxona"], answerIndex: 0, feedback: "La N-acetilcisteína protege al hígado en casos de intoxicación por paracetamol." },
  { text: "¿Qué significa 'toxicidad terapéutica'?", options: ["Efectos tóxicos dentro del rango terapéutico", "Uso prolongado del fármaco", "Tolerancia", "Dependencia"], answerIndex: 0, feedback: "Algunos fármacos pueden causar daño incluso a dosis terapéuticas." },
  { text: "¿Qué es un antibiótico de amplio espectro?", options: ["Actúa contra muchas bacterias diferentes", "Solo actúa contra virus", "Solo sirve para hongos", "Se usa en dosis muy altas"], answerIndex: 0, feedback: "Los antibióticos de amplio espectro eliminan bacterias grampositivas y gramnegativas." },
  { text: "¿Qué medicamento se usa como broncodilatador en el asma?", options: ["Salbutamol", "Atenolol", "Diazepam", "Paracetamol"], answerIndex: 0, feedback: "El salbutamol activa receptores beta2, relajando el músculo bronquial." },
  { text: "¿Qué fármaco es un anticoagulante oral?", options: ["Warfarina", "Paracetamol", "Amoxicilina", "Diazepam"], answerIndex: 0, feedback: "La warfarina inhibe la síntesis de factores de coagulación dependientes de vitamina K." },
  { text: "¿Qué son los diuréticos?", options: ["Fármacos que aumentan la eliminación de orina", "Fármacos que reducen la presión arterial cerebral", "Fármacos que elevan la glucosa", "Fármacos que reducen el metabolismo"], answerIndex: 0, feedback: "Los diuréticos eliminan sodio y agua para reducir el volumen sanguíneo." },
  { text: "¿Cuál es un ejemplo de diurético de asa?", options: ["Furosemida", "Hidroclorotiazida", "Espironolactona", "Acetazolamida"], answerIndex: 0, feedback: "La furosemida actúa en el asa de Henle aumentando la excreción de sodio y agua." },
  { text: "¿Qué significa farmacodinámica?", options: ["Estudio de los efectos del fármaco sobre el organismo", "Estudio del metabolismo del fármaco", "Estudio de la excreción renal", "Estudio del transporte celular"], answerIndex: 0, feedback: "La farmacodinámica describe el mecanismo de acción y efectos del fármaco." },
  { text: "¿Cuál es el principal efecto secundario de los AINEs en el sistema digestivo?", options: ["Úlcera gástrica", "Estreñimiento", "Náuseas leves", "Diarrea"], answerIndex: 0, feedback: "Los AINEs pueden irritar la mucosa gástrica y causar úlceras." },
  { text: "¿Qué es una interacción medicamentosa?", options: ["Alteración de los efectos por otro fármaco o alimento", "Efecto secundario", "Alergia", "Tolerancia"], answerIndex: 0, feedback: "Las interacciones ocurren cuando un fármaco modifica el efecto de otro." },
  { text: "¿Cuál es el antídoto para la intoxicación por opioides?", options: ["Naloxona", "N-acetilcisteína", "Vitamina K", "Atropina"], answerIndex: 0, feedback: "La naloxona revierte rápidamente la depresión respiratoria causada por opioides." },
  { text: "¿Qué tipo de fármaco es la insulina?", options: ["Hormona hipoglucemiante", "Antihipertensivo", "Antibiótico", "Analgésico"], answerIndex: 0, feedback: "La insulina disminuye la glucosa sanguínea al facilitar su entrada a las células." },
  { text: "¿Cuál es el principal uso de la metformina?", options: ["Tratamiento de la diabetes tipo 2", "Hipertensión", "Depresión", "Infecciones"], answerIndex: 0, feedback: "La metformina reduce la producción hepática de glucosa y mejora la sensibilidad a la insulina." },
  { text: "¿Qué efecto tiene la adrenalina?", options: ["Aumenta la frecuencia cardíaca y la presión arterial", "Disminuye la glucosa", "Causa sedación", "Relaja el intestino"], answerIndex: 0, feedback: "La adrenalina activa el sistema simpático provocando aumento de la frecuencia y presión arterial." },
  { text: "¿Cuál es el mecanismo de acción de los IECA?", options: ["Inhiben la enzima convertidora de angiotensina", "Bloquean los receptores beta", "Reducen la frecuencia respiratoria", "Aumentan la absorción de sodio"], answerIndex: 0, feedback: "Los IECA bloquean la formación de angiotensina II, reduciendo la presión arterial." },
  { text: "¿Cuál es el uso principal de los antihistamínicos?", options: ["Tratar alergias", "Reducir la presión arterial", "Aumentar la frecuencia cardíaca", "Tratar infecciones"], answerIndex: 0, feedback: "Los antihistamínicos bloquean los receptores H1, aliviando síntomas alérgicos." },
  { text: "¿Qué tipo de medicamento es la morfina?", options: ["Analgésico opioide", "Analgésico no opioide", "Ansiolítico", "Antibiótico"], answerIndex: 0, feedback: "La morfina es un potente analgésico opioide para dolor severo." },
  { text: "¿Qué es la tolerancia farmacológica?", options: ["Disminución del efecto con el uso continuo", "Reacción alérgica", "Respuesta inmediata", "Efecto placebo"], answerIndex: 0, feedback: "La tolerancia se desarrolla cuando se necesitan dosis mayores para el mismo efecto." },
  { text: "¿Qué es la dependencia física?", options: ["Necesidad fisiológica del fármaco para evitar síntomas de abstinencia", "Preferencia psicológica", "Interacción adversa", "Efecto placebo"], answerIndex: 0, feedback: "La dependencia física ocurre cuando el cuerpo se adapta al uso continuo del fármaco." },
  { text: "¿Qué fármaco se usa como anticonvulsivante principal?", options: ["Fenitoína", "Furosemida", "Paracetamol", "Diazepam"], answerIndex: 0, feedback: "La fenitoína estabiliza las membranas neuronales y previene crisis epilépticas." },
  { text: "¿Qué es un antibiótico bactericida?", options: ["Mata las bacterias", "Inhibe su crecimiento", "Neutraliza toxinas", "Aumenta su reproducción"], answerIndex: 0, feedback: "Los bactericidas destruyen directamente las bacterias." },
  { text: "¿Qué es un antibiótico bacteriostático?", options: ["Inhibe el crecimiento bacteriano", "Mata las bacterias", "Neutraliza virus", "Aumenta la fiebre"], answerIndex: 0, feedback: "Los bacteriostáticos impiden la reproducción de las bacterias para que el cuerpo las elimine." },
  { text: "¿Cuál es un efecto adverso común de los antibióticos?", options: ["Diarrea", "Hipertensión", "Euforia", "Somnolencia extrema"], answerIndex: 0, feedback: "La alteración de la flora intestinal puede causar diarrea durante el uso de antibióticos." },
  { text: "¿Qué significa farmacovigilancia?", options: ["Monitoreo de efectos adversos tras la comercialización", "Prueba de laboratorio previa al uso", "Medición de la dosis", "Control de temperatura del fármaco"], answerIndex: 0, feedback: "La farmacovigilancia detecta, evalúa y previene efectos adversos de medicamentos." },
  { text: "¿Qué medicamento se utiliza para tratar la hipertensión arterial?", options: ["Enalapril", "Ibuprofeno", "Amoxicilina", "Diazepam"], answerIndex: 0, feedback: "El enalapril es un IECA usado comúnmente para controlar la presión arterial." },
  { text: "¿Cuál es la función de los antiácidos?", options: ["Neutralizar el ácido gástrico", "Estimular el apetito", "Reducir el metabolismo", "Inducir el sueño"], answerIndex: 0, feedback: "Los antiácidos neutralizan el exceso de ácido en el estómago, aliviando la acidez." },
  { text: "¿Cuál es el principal uso de la dopamina en medicina?", options: ["Tratar shock o insuficiencia cardíaca", "Sedante", "Antibiótico", "Hipoglucemiante"], answerIndex: 0, feedback: "La dopamina mejora la perfusión renal y cardíaca en situaciones críticas." },
  { text: "¿Qué medicamento se usa para revertir la anticoagulación por warfarina?", options: ["Vitamina K", "Atropina", "Naloxona", "N-acetilcisteína"], answerIndex: 0, feedback: "La vitamina K contrarresta el efecto anticoagulante de la warfarina." },
  { text: "¿Qué grupo farmacológico bloquea la recaptación de serotonina?", options: ["Antidepresivos ISRS", "Antibióticos", "Antihipertensivos", "Analgésicos"], answerIndex: 0, feedback: "Los ISRS aumentan la serotonina en el cerebro, mejorando el estado de ánimo." },
  { text: "¿Qué significa 'efecto sinérgico'?", options: ["Combinación de fármacos con efecto mayor que la suma individual", "Disminución del efecto", "Neutralización mutua", "Reacción alérgica"], answerIndex: 0, feedback: "El efecto sinérgico ocurre cuando dos fármacos potencian mutuamente su acción." },
  { text: "¿Qué fármaco se usa como bloqueador beta para angina e hipertensión?", options: ["Atenolol", "Paracetamol", "Amoxicilina", "Furosemida"], answerIndex: 0, feedback: "El atenolol reduce la frecuencia cardíaca y la presión arterial." },
  { text: "¿Cuál es el uso terapéutico del omeprazol?", options: ["Tratar gastritis y úlceras", "Reducir presión arterial", "Aliviar alergias", "Tratar infecciones"], answerIndex: 0, feedback: "El omeprazol inhibe la bomba de protones, reduciendo la producción de ácido gástrico." },
  { text: "¿Qué medicamento se usa para la epilepsia y trastorno bipolar?", options: ["Ácido valproico", "Furosemida", "Enalapril", "Amoxicilina"], answerIndex: 0, feedback: "El ácido valproico estabiliza las neuronas, reduciendo crisis epilépticas y episodios maníacos." },
  { text: "¿Qué son los corticoides?", options: ["Antiinflamatorios esteroideos", "Antibióticos", "Antihistamínicos", "Hipoglucemiantes"], answerIndex: 0, feedback: "Los corticoides reducen inflamación e inhiben la respuesta inmune." },
  { text: "¿Cuál es un ejemplo de corticoide?", options: ["Prednisona", "Amoxicilina", "Paracetamol", "Omeprazol"], answerIndex: 0, feedback: "La prednisona es un corticoide usado en inflamaciones y enfermedades autoinmunes." },
  { text: "¿Qué fármaco se utiliza como antídoto en intoxicación por benzodiacepinas?", options: ["Flumazenil", "Naloxona", "Atropina", "Vitamina K"], answerIndex: 0, feedback: "El flumazenil antagoniza los efectos de las benzodiacepinas." },
  { text: "¿Qué medicamento se usa para tratar infecciones por hongos?", options: ["Fluconazol", "Cefalexina", "Amoxicilina", "Ciprofloxacino"], answerIndex: 0, feedback: "El fluconazol es un antifúngico de amplio espectro." },
  { text: "¿Qué tipo de fármaco es la amoxicilina?", options: ["Antibiótico betalactámico", "Analgésico", "Ansiolítico", "Corticoide"], answerIndex: 0, feedback: "La amoxicilina es un antibiótico derivado de la penicilina." },
  { text: "¿Qué significa dosis tóxica?", options: ["Cantidad de fármaco que causa daño", "Dosis terapéutica mínima", "Cantidad inocua", "Efecto placebo"], answerIndex: 0, feedback: "La dosis tóxica produce efectos perjudiciales o letales." },
  { text: "¿Qué medicamento se usa como anticolinérgico?", options: ["Atropina", "Paracetamol", "Insulina", "Furosemida"], answerIndex: 0, feedback: "La atropina bloquea receptores muscarínicos y aumenta la frecuencia cardíaca." },
  { text: "¿Cuál es el uso principal de la digoxina?", options: ["Insuficiencia cardíaca", "Asma", "Gastritis", "Hipertensión leve"], answerIndex: 0, feedback: "La digoxina mejora la contractilidad cardíaca en la insuficiencia cardíaca." },
  { text: "¿Qué significa farmacogenética?", options: ["Estudio de cómo los genes afectan la respuesta a los fármacos", "Estudio del metabolismo hepático", "Estudio del efecto placebo", "Estudio del pH sanguíneo"], answerIndex: 0, feedback: "La farmacogenética estudia cómo la variación genética modifica la eficacia o toxicidad de un fármaco." },
  { text: "¿Qué tipo de fármaco es el ibuprofeno?", options: ["Antiinflamatorio no esteroideo (AINE)", "Antidepresivo", "Ansiolítico", "Antihistamínico"], answerIndex: 0, feedback: "El ibuprofeno reduce inflamación, fiebre y dolor inhibiendo COX-1 y COX-2." },
  { text: "¿Cuál es la función principal del suero glucosalino?", options: ["Rehidratación y aporte energético", "Antibiótico", "Analgésico", "Sedante"], answerIndex: 0, feedback: "El suero glucosalino restituye líquidos, electrolitos y energía." },
  { text: "¿Qué es una reacción alérgica medicamentosa?", options: ["Respuesta inmunitaria anormal a un fármaco", "Toxicidad directa", "Efecto placebo", "Hipotensión fisiológica"], answerIndex: 0, feedback: "Las alergias se deben a una respuesta inmunitaria exagerada al fármaco." },
  { text: "¿Cuál es un efecto secundario de los corticoides a largo plazo?", options: ["Aumento de peso y osteoporosis", "Hipotensión", "Hipotermia", "Anemia"], answerIndex: 0, feedback: "El uso prolongado de corticoides puede causar retención de líquidos y desmineralización ósea." },
  { text: "¿Qué fármaco se usa para reducir el colesterol?", options: ["Atorvastatina", "Paracetamol", "Enalapril", "Diazepam"], answerIndex: 0, feedback: "La atorvastatina inhibe la síntesis de colesterol en el hígado." },
  { text: "¿Qué es un excipiente?", options: ["Sustancia inactiva que acompaña al principio activo", "Sustancia tóxica", "Receptor celular", "Enzima hepática"], answerIndex: 0, feedback: "El excipiente facilita la administración del principio activo sin tener acción terapéutica." },
  { text: "¿Cuál es el mecanismo de acción de los bloqueadores de canales de calcio?", options: ["Reducen la entrada de calcio en células musculares", "Aumentan el sodio intracelular", "Inhiben la glucólisis", "Estimulan el sistema nervioso central"], answerIndex: 0, feedback: "Los bloqueadores de canales de calcio relajan el músculo liso vascular y reducen la presión arterial." },
  { text: "¿Qué medicamento se usa para tratar la tuberculosis?", options: ["Isoniazida", "Amoxicilina", "Ciprofloxacino", "Penicilina"], answerIndex: 0, feedback: "La isoniazida inhibe la síntesis de ácidos micólicos de la pared bacteriana del Mycobacterium tuberculosis." },
  { text: "¿Qué tipo de medicamento es la heparina?", options: ["Anticoagulante", "Analgésico", "Antibiótico", "Ansiolítico"], answerIndex: 0, feedback: "La heparina impide la formación de coágulos sanguíneos al activar la antitrombina III." },
  { text: "¿Qué fármaco se usa como antiemético?", options: ["Metoclopramida", "Amoxicilina", "Diazepam", "Omeprazol"], answerIndex: 0, feedback: "La metoclopramida bloquea receptores dopaminérgicos reduciendo náuseas y vómitos." },
  { text: "¿Qué medicamento es un antitusivo?", options: ["Dextrometorfano", "Salbutamol", "Amoxicilina", "Ibuprofeno"], answerIndex: 0, feedback: "El dextrometorfano inhibe el reflejo de la tos a nivel central." },
  { text: "¿Qué es la farmacoterapia?", options: ["Uso de medicamentos para tratar enfermedades", "Estudio del metabolismo", "Uso de vacunas", "Técnica quirúrgica"], answerIndex: 0, feedback: "La farmacoterapia aplica los conocimientos farmacológicos para tratar o prevenir enfermedades." },

    let selectedSubject = "";
    let questions = [];
    let currentQuestionIndex = 0;
    let score = 0;

    function startQuiz(subject) {
      selectedSubject = subject;
      document.getElementById("start-screen").classList.remove("active");
      document.getElementById("quiz-screen").classList.add("active");

      // Cargar 25 preguntas aleatorias (aquí solo hay 3 de ejemplo)
      questions = shuffle(allQuestions[subject]).slice(0, 25);
      currentQuestionIndex = 0;
      score = 0;
      showQuestion();
    }

    function showQuestion() {
      const question = questions[currentQuestionIndex];
      document.getElementById("question-text").textContent = question.text;
      const optionsDiv = document.getElementById("options");
      optionsDiv.innerHTML = "";

      question.options.forEach((opt, index) => {
        const btn = document.createElement("button");
        btn.textContent = opt;
        btn.onclick = () => checkAnswer(index);
        optionsDiv.appendChild(btn);
      });

      updateProgressBar();
    }

    function checkAnswer(selectedIndex) {
      const question = questions[currentQuestionIndex];
      const isCorrect = selectedIndex === question.answerIndex;

      document.getElementById("quiz-screen").classList.remove("active");
      document.getElementById("feedback-screen").classList.add("active");

      if (isCorrect) {
        score++;
        document.getElementById("feedback-message").textContent = "Bien hecho mi niña 💖";
        document.getElementById("feedback-detail").textContent = "";
      } else {
        document.getElementById("feedback-message").textContent = "Buen intento, tú puedes gordita 💕";
        document.getElementById("feedback-detail").textContent = "💡 " + question.feedback;
      }
    }

    function nextQuestion() {
      document.getElementById("feedback-screen").classList.remove("active");
      currentQuestionIndex++;

      if (currentQuestionIndex < questions.length) {
        document.getElementById("quiz-screen").classList.add("active");
        showQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      document.getElementById("result-screen").classList.add("active");
      const percentage = (score / questions.length) * 100;
      document.getElementById("result-text").textContent = `Tu resultado: ${score}/${questions.length} (${percentage.toFixed(0)}%)`;

      let message = "";
      if (percentage < 50) message = "Buen intento, sé que puedes mejorar 💗";
      else if (percentage < 90) message = "Vas por buen camino ¡Vamos por más! 💪";
      else message = "Eres una chingona ¡Estoy orgulloso de ti! 💞";

      document.getElementById("result-message").textContent = message;
    }

    function goHome() {
      document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
      document.getElementById("start-screen").classList.add("active");
      document.getElementById("progress-bar").style.width = "0%";
    }

    function updateProgressBar() {
      const progress = ((currentQuestionIndex) / questions.length) * 100;
      document.getElementById("progress-bar").style.width = `${progress}%`;
    }

    function shuffle(array) {
      return array.sort(() => Math.random() - 0.5);
    }
  </script>
